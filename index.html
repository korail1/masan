<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자동폐색장치 주파수 수신기 & 파형 분석기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Header Section -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sm:p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-xl font-bold shadow-lg">
                    <i class="fa-solid fa-microscope"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-100 leading-tight">자동폐색장치 주파수 수신기</h1>
                    <p class="text-xs text-slate-400">정현파 파형 분석 및 케이블/보안기 진단기</p>
                </div>
            </div>
            <!-- Receiver Power Toggle Button -->
            <button id="toggleBtn" class="px-4 py-2 rounded-xl font-bold text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 active:scale-95 text-white transition-all shadow-md flex items-center gap-2">
                <i class="fa-solid fa-power-off" id="btnIcon"></i>
                <span id="btnText">수신 시작</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl w-full mx-auto p-3 sm:p-5 flex-1 flex flex-col gap-4">

        <!-- Waveform Viewer & Real-time Signal Stats -->
        <div class="bg-cardBg border border-slate-700/60 rounded-2xl p-3 sm:p-4 shadow-xl flex flex-col gap-3">
            
            <!-- Target Channel Display Header -->
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                    <span id="targetBadge" class="px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-xs font-bold">
                        f1 (625Hz)
                    </span>
                    <span id="txrxLabel" class="text-xs font-mono text-slate-400">TX: T701 / RX: R701</span>
                </div>
                <div class="flex items-center gap-2 text-xs">
                    <span class="text-slate-400">실시간 피크:</span>
                    <span id="peakAmpText" class="font-mono text-cyan-400 font-bold">0 %</span>
                </div>
            </div>

            <!-- Waveform Canvas Box -->
            <div class="relative w-full h-56 sm:h-64 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                <canvas id="freqCanvas"></canvas>
                
                <!-- Grid Center Guide Lines Overlay -->
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="w-full border-b border-cyan-500/20 border-dashed"></div>
                </div>

                <!-- Signal Status Overlay Overlay -->
                <div id="statusOverlay" class="absolute top-3 right-3 px-3 py-1.5 rounded-lg bg-slate-900/80 border border-slate-700 text-xs font-bold text-slate-400 flex items-center gap-2 backdrop-blur-sm">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText">대기 중</span>
                </div>
            </div>

            <div class="flex justify-between items-center text-[11px] text-slate-400 px-1">
                <span><i class="fa-solid fa-circle-info mr-1 text-cyan-400"></i>정현파 파형이 매끄럽지 않거나 찌그러지면 보안기/케이블 불량입니다.</span>
                <span id="measuredHzText" class="font-mono text-emerald-400 font-bold">-- Hz</span>
            </div>
        </div>

        <!-- 14 Channel Grid (5 Cols 3 Rows) -->
        <div class="bg-cardBg border border-slate-700/60 rounded-2xl p-3 sm:p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-xs font-bold text-slate-300">채널 선택 및 14CH 수신 감지 상태</h2>
                <span class="text-[10px] text-slate-400">버튼 터치 시 해당 정현파 파형 관측</span>
            </div>
            
            <div class="grid grid-cols-5 gap-1.5 sm:gap-2" id="freqGrid">
                <!-- 14 Frequency Cards render dynamically here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-slate-500 text-[11px] border-t border-slate-800/80">
        자동폐색장치 정현파 주파수 검사기 &copy; 2026
    </footer>

    <script>
        // 14 Channels Table Definition
        const FREQ_TABLE = [
            { id: 'f1',  tx: 'T701', rx: 'R701', target: 625 },
            { id: 'f2',  tx: 'T702', rx: 'R702', target: 875 },
            { id: 'f3',  tx: 'T703', rx: 'R703', target: 1125 },
            { id: 'f4',  tx: 'T704', rx: 'R704', target: 1375 },
            { id: 'f5',  tx: 'T705', rx: 'R705', target: 1625 },
            { id: 'f6',  tx: 'T706', rx: 'R706', target: 1875 },
            { id: 'f7',  tx: 'T707', rx: 'R707', target: 2125 },
            { id: 'f8',  tx: 'T708', rx: 'R708', target: 2375 },
            { id: 'f9',  tx: 'T709', rx: 'R709', target: 2625 },
            { id: 'f10', tx: 'T710', rx: 'R710', target: 3125 },
            { id: 'f11', tx: 'T711', rx: 'R711', target: 3625 },
            { id: 'f12', tx: 'T712', rx: 'R712', target: 4125 },
            { id: 'f13', tx: 'T713', rx: 'R713', target: 4625 },
            { id: 'f14', tx: 'T714', rx: 'R714', target: 7125 }
        ];

        const TOLERANCE = 25; // Target Hz tolerance
        let selectedChannel = FREQ_TABLE[0]; // Active view channel

        let audioCtx = null;
        let analyser = null;
        let mediaStream = null;
        let animationFrameId = null;
        let isMeasuring = false;

        // History tracking for detection stabilization
        const historyMap = {};
        FREQ_TABLE.forEach(item => historyMap[item.id] = []);

        // DOM elements
        const toggleBtn = document.getElementById("toggleBtn");
        const btnText = document.getElementById("btnText");
        const btnIcon = document.getElementById("btnIcon");
        const freqCanvas = document.getElementById("freqCanvas");
        const freqCtx = freqCanvas.getContext("2d");

        const targetBadge = document.getElementById("targetBadge");
        const txrxLabel = document.getElementById("txrxLabel");
        const peakAmpText = document.getElementById("peakAmpText");
        const measuredHzText = document.getElementById("measuredHzText");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        // Initialize 14 Channel Grid
        function initGrid() {
            const gridEl = document.getElementById("freqGrid");
            gridEl.innerHTML = "";

            FREQ_TABLE.forEach((item, index) => {
                const btn = document.createElement("button");
                btn.id = `card-${item.id}`;
                btn.className = `p-2 rounded-xl border text-left transition-all flex flex-col justify-between min-h-[64px] relative overflow-hidden ${
                    selectedChannel.id === item.id 
                    ? 'bg-slate-800 border-cyan-400 ring-2 ring-cyan-400/30' 
                    : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                }`;

                btn.onclick = () => selectChannel(item);

                btn.innerHTML = `
                    <div class="flex items-center justify-between w-full">
                        <span class="font-bold text-xs ${selectedChannel.id === item.id ? 'text-cyan-300' : 'text-slate-200'}">${item.id}</span>
                        <span class="text-[9px] font-mono text-slate-500">${item.target}Hz</span>
                    </div>
                    <div class="text-[9px] text-slate-500 font-mono">${item.tx}/${item.rx}</div>
                    
                    <!-- Signal Level Meter Bar -->
                    <div class="w-full bg-slate-800 h-1 rounded-full mt-1 overflow-hidden">
                        <div id="bar-${item.id}" class="h-full w-0 bg-slate-600 transition-all duration-150"></div>
                    </div>
                `;
                gridEl.appendChild(btn);
            });
        }

        // Select specific channel to view sine wave
        function selectChannel(item) {
            selectedChannel = item;
            targetBadge.innerText = `${item.id} (${item.target}Hz)`;
            txrxLabel.innerText = `TX: ${item.tx} / RX: ${item.rx}`;
            
            // Re-render channel grid borders
            FREQ_TABLE.forEach(i => {
                const card = document.getElementById(`card-${i.id}`);
                if (card) {
                    if (i.id === item.id) {
                        card.className = "p-2 rounded-xl border text-left transition-all flex flex-col justify-between min-h-[64px] relative bg-slate-800 border-cyan-400 ring-2 ring-cyan-400/30";
                    } else {
                        card.className = "p-2 rounded-xl border text-left transition-all flex flex-col justify-between min-h-[64px] relative bg-slate-900 border-slate-800 hover:border-slate-700";
                    }
                }
            });
        }

        // Adjust Canvas Retina DPI Scale for iOS / Android
        function updateCanvasSize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = freqCanvas.getBoundingClientRect();
            freqCanvas.width = rect.width * dpr;
            freqCanvas.height = rect.height * dpr;
            freqCtx.scale(dpr, dpr);
        }

        // Toggle Audio Measurement
        toggleBtn.addEventListener("click", async () => {
            if (!isMeasuring) {
                await startMeasurement();
            } else {
                stopMeasurement();
            }
        });

        // Start Receiver
        async function startMeasurement() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Optimal size for time-domain sine wave rendering

                const microphone = audioCtx.createMediaStreamSource(mediaStream);
                microphone.connect(analyser);

                isMeasuring = true;
                btnText.innerText = "수신 중지";
                btnIcon.className = "fa-solid fa-stop text-rose-400";
                toggleBtn.className = "px-4 py-2 rounded-xl font-bold text-xs sm:text-sm bg-rose-600 hover:bg-rose-500 active:scale-95 text-white transition-all shadow-md flex items-center gap-2";

                updateCanvasSize();
                draw();
            } catch (err) {
                alert("마이크/라인 입력 권한 오류: " + err.message);
            }
        }

        // Stop Receiver
        function stopMeasurement() {
            isMeasuring = false;

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }

            btnText.innerText = "수신 시작";
            btnIcon.className = "fa-solid fa-power-off";
            toggleBtn.className = "px-4 py-2 rounded-xl font-bold text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 active:scale-95 text-white transition-all shadow-md flex items-center gap-2";

            // Reset UI States
            peakAmpText.innerText = "0 %";
            measuredHzText.innerText = "-- Hz";
            statusDot.className = "w-2 h-2 rounded-full bg-slate-500";
            statusText.innerText = "대기 중";

            FREQ_TABLE.forEach(item => {
                const bar = document.getElementById(`bar-${item.id}`);
                if (bar) bar.style.width = "0%";
            });

            // Draw Blank Canvas Grid
            drawEmptyGrid();
        }

        function drawEmptyGrid() {
            const rect = freqCanvas.getBoundingClientRect();
            freqCtx.clearRect(0, 0, rect.width, rect.height);
            freqCtx.strokeStyle = '#1e293b';
            freqCtx.lineWidth = 1;

            // Draw Horizontal Center Line
            freqCtx.beginPath();
            freqCtx.moveTo(0, rect.height / 2);
            freqCtx.lineTo(rect.width, rect.height / 2);
            freqCtx.stroke();
        }

        // Main Draw Loop
        function draw() {
            if (!isMeasuring) return;

            animationFrameId = requestAnimationFrame(draw);

            const rect = freqCanvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            // 1. Time-Domain Data (Sine Waveform)
            const timeData = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(timeData);

            // 2. Frequency Domain Data (Spectrum Peak Hz)
            const freqData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(freqData);

            // Clear Canvas
            freqCtx.fillStyle = '#020617';
            freqCtx.fillRect(0, 0, width, height);

            // Draw Background Grid
            freqCtx.strokeStyle = '#0f172a';
            freqCtx.lineWidth = 1;
            for (let x = 0; x < width; x += 30) {
                freqCtx.beginPath();
                freqCtx.moveTo(x, 0);
                freqCtx.lineTo(x, height);
                freqCtx.stroke();
            }
            for (let y = 0; y < height; y += 30) {
                freqCtx.beginPath();
                freqCtx.moveTo(0, y);
                freqCtx.lineTo(width, y);
                freqCtx.stroke();
            }

            // Calculate Peak Amplitude & Max Frequency
            let maxVal = 0;
            let peakBin = 0;
            const binResolution = (audioCtx.sampleRate / 2) / analyser.frequencyBinCount;

            for (let i = 0; i < freqData.length; i++) {
                if (freqData[i] > maxVal) {
                    maxVal = freqData[i];
                    peakBin = i;
                }
            }

            const measuredHz = Math.round(peakBin * binResolution);
            const peakPercent = Math.round((maxVal / 255) * 100);
            peakAmpText.innerText = `${peakPercent} %`;

            if (maxVal > 30) {
                measuredHzText.innerText = `수신: ${measuredHz} Hz`;
            } else {
                measuredHzText.innerText = `수신: -- Hz`;
            }

            // Update Channel Level Bars & Status
            let activeSelectedFound = false;

            FREQ_TABLE.forEach(item => {
                const minHz = item.target - TOLERANCE;
                const maxHz = item.target + TOLERANCE;
                const targetBinStart = Math.floor(minHz / binResolution);
                const targetBinEnd = Math.ceil(maxHz / binResolution);

                let channelMax = 0;
                for (let b = targetBinStart; b <= targetBinEnd; b++) {
                    if (freqData[b] > channelMax) channelMax = freqData[b];
                }

                const levelPct = Math.round((channelMax / 255) * 100);
                const bar = document.getElementById(`bar-${item.id}`);
                if (bar) {
                    bar.style.width = `${levelPct}%`;
                    if (levelPct > 40) {
                        bar.className = "h-full bg-emerald-400 transition-all duration-150";
                    } else if (levelPct > 15) {
                        bar.className = "h-full bg-amber-400 transition-all duration-150";
                    } else {
                        bar.className = "h-full bg-slate-600 transition-all duration-150";
                    }
                }

                if (item.id === selectedChannel.id && levelPct > 30) {
                    activeSelectedFound = true;
                }
            });

            // Update Status Badge Overlay
            if (activeSelectedFound) {
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
                statusText.innerText = "신호 양호 (정현파 정상)";
                statusText.className = "text-emerald-400 font-bold";
            } else if (maxVal > 20) {
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
                statusText.innerText = "신호 미약 / 타채널 수신중";
                statusText.className = "text-amber-400 font-bold";
            } else {
                statusDot.className = "w-2 h-2 rounded-full bg-rose-500";
                statusText.innerText = "신호 없음 (단선/감쇄)";
                statusText.className = "text-rose-400 font-bold";
            }

            // Draw Sine Waveform (Time Domain)
            freqCtx.lineWidth = 2.5;
            freqCtx.strokeStyle = activeSelectedFound ? '#00ffcc' : '#38bdf8';
            freqCtx.beginPath();

            const sliceWidth = width / timeData.length;
            let x = 0;

            for (let i = 0; i < timeData.length; i++) {
                const v = timeData[i] / 128.0; // 0.0 ~ 2.0 (1.0 center)
                const y = (v * height) / 2;

                if (i === 0) {
                    freqCtx.moveTo(x, y);
                } else {
                    freqCtx.lineTo(x, y);
                }
                x += sliceWidth;
            }

            freqCtx.lineTo(width, height / 2);
            freqCtx.stroke();
        }

        // Screen Resize Responsive Handler
        window.addEventListener('resize', () => {
            if (isMeasuring) updateCanvasSize();
            else drawEmptyGrid();
        });

        // Initialize App
        initGrid();
        drawEmptyGrid();
    </script>
</body>
</html>
